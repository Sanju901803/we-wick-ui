<div style="max-width: 800px">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <h4 class="fw-bold mb-0">{{title}}</h4>
    <a
      class="link-primary fw-semibold"
      [href]="officialSectionUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      Read the official Applying for Citizenship section
    </a>
  </div>

  <section *ngFor="let section of sections" class="card border-0 shadow-sm mb-3 overflow-hidden">
    <div class="card-body p-0">
      <h5 class="fw-bold mb-0 px-4 py-3 bg-primary-subtle text-primary-emphasis border-bottom border-primary-subtle">{{section.title}}</h5>
      <div class="px-4 py-3">
        <ul class="mb-0">
          <li *ngFor="let point of section.points" class="mb-2">{{point}}</li>
        </ul>
      </div>
    </div>
  </section>
</div>
