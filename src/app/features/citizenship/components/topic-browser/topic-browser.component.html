<div class="container px-2 px-md-3">
<div class="d-flex flex-column flex-md-row" style="min-height: calc(100vh - 120px)">
  <!-- Left sidebar nav: horizontal scrollable strip (with scroll arrows) on mobile/tablet, vertical wrapping sidebar on md+ -->
  <nav class="topic-sidebar border-end border-bottom border-md-bottom-0 bg-white position-relative">
    <button type="button" class="topic-nav-arrow topic-nav-arrow-left d-md-none" aria-label="Scroll to previous topics" (click)="scrollTopics(-1)">‹</button>
    <div #topicNavList class="list-group list-group-flush topic-nav-list d-flex flex-row flex-md-column">
      <a *ngFor="let topic of topics"
        class="list-group-item list-group-item-action topic-nav-item d-flex flex-column flex-md-row align-items-center text-center text-md-start gap-1 gap-md-2 py-2 px-3 border-0 flex-shrink-0"
        [routerLink]="getRoute(topic.name)"
        routerLinkActive="active ww-sidebar-active text-white">
        <app-icon [iconKey]="asIconKey(topic.iconKey)" [fallbackEmoji]="topic.icon" [size]="20"></app-icon>
        <span class="fw-semibold" style="font-size:0.8rem">{{topic.name}}</span>
      </a>
    </div>
    <button type="button" class="topic-nav-arrow topic-nav-arrow-right d-md-none" aria-label="Scroll to next topics" (click)="scrollTopics(1)">›</button>
  </nav>

  <!-- Right content panel -->
  <main class="flex-fill p-3 p-md-4 overflow-auto bg-light">
    <router-outlet></router-outlet>
  </main>
</div>
</div>
