<div class="container">
<div class="d-flex" style="min-height: calc(100vh - 120px)">
  <!-- Left sidebar nav -->
  <nav class="topic-sidebar border-end bg-white" style="min-width: 260px; max-width: 260px;">
    <div class="list-group list-group-flush">
      <a *ngFor="let topic of topics"
        class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2 px-3 border-0"
        [routerLink]="getRoute(topic.name)"
        routerLinkActive="active ww-sidebar-active text-white">
        <app-icon [iconKey]="asIconKey(topic.iconKey)" [fallbackEmoji]="topic.icon" [size]="20"></app-icon>
        <span class="fw-semibold" style="font-size:0.85rem">{{topic.name}}</span>
      </a>
    </div>
  </nav>

  <!-- Right content panel -->
  <main class="flex-fill p-4 overflow-auto bg-light">
    <router-outlet></router-outlet>
  </main>
</div>
</div>
